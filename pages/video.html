<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orix</title>
    
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.1/400.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.1/500.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.1/600.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.0.1/400.css" rel="stylesheet">
    
    <link rel="stylesheet" href="/public/css/main.css">
    <link rel="stylesheet" href="/public/css/player.css">
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
    <div class="logo-container" onclick="window.location.href='/'">
        <img src="/public/logo.svg" alt="Orix" class="logo-icon">
        orix
    </div>
    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search videos, creators, or topics..."
               onkeydown="if(event.key==='Enter') window.location.href='/?q='+this.value">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
    </div>
    <div class="topbar-right">
        <button class="upload-btn" onclick="window.location.href='/upload'">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Upload
        </button>
        <div class="profile-btn" onclick="window.location.href='/profile'" title="My Profile">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
        </div>
    </div>
</header>

<!-- VIDEO PAGE LAYOUT -->
<div class="video-page">
    
    <!-- LEFT: MAIN VIDEO -->
    <div class="video-main">
        <!-- CUSTOM PLAYER -->
        <div class="player-container" id="playerContainer">
            <video class="player-video" id="playerVideo" preload="metadata"></video>

            <!-- Big Play Button (center) -->
            <div class="play-center-btn hidden" id="playCenterBtn">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
                    <polygon points="5 3 19 12 5 21 5 3"/>
                </svg>
            </div>

            <!-- Controls -->
            <div class="player-controls" id="playerControls">
                <!-- Progress Bar -->
                <div class="player-progress" id="playerProgress">
                    <div class="player-buffered" id="playerBuffered"></div>
                    <div class="player-progress-fill" id="playerProgressFill"></div>
                </div>

                <!-- Controls Row -->
                <div class="player-controls-row">
                    <!-- Play/Pause -->
                    <button class="player-btn" id="playPauseBtn" title="Play/Pause (Space)">
                        <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                            <polygon points="5 3 19 12 5 21 5 3"/>
                        </svg>
                        <svg id="pauseIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
                            <rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>
                        </svg>
                    </button>

                    <!-- Volume -->
                    <div class="volume-group">
                        <button class="player-btn" id="muteBtn" title="Mute (M)">
                            <svg id="volumeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
                                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                            </svg>
                        </button>
                        <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1">
                    </div>

                    <!-- Time -->
                    <span class="player-time" id="playerTime">0:00 / 0:00</span>

                    <div class="player-spacer"></div>

                    <!-- Speed -->
                    <select class="player-select" id="speedSelect" title="Playback Speed">
                        <option value="0.5">0.5×</option>
                        <option value="0.75">0.75×</option>
                        <option value="1" selected>1×</option>
                        <option value="1.25">1.25×</option>
                        <option value="1.5">1.5×</option>
                        <option value="2">2×</option>
                    </select>

                    <!-- Quality -->
                    <select class="player-select" id="qualitySelect" title="Video Quality">
                        <option value="original">Auto</option>
                    </select>

                    <!-- Fullscreen -->
                    <button class="player-btn" id="fullscreenBtn" title="Fullscreen (F)">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- VIDEO INFO -->
        <div class="video-info-section">
            <h1 class="video-page-title" id="videoTitle">Loading...</h1>
            <div class="video-meta-row">
                <span class="video-views-count" id="videoViews">— views</span>
                <span class="video-date" id="videoDate"></span>
            </div>

            <div class="video-actions-bar">
                <div class="creator-left">
                    <div class="creator-avatar" id="creatorAvatar">—</div>
                    <div>
                        <div class="creator-name" id="creatorName">—</div>
                        <div style="font-size:12px; color:var(--text-secondary);" id="subscriberCount">0 subscribers</div>
                    </div>
                    <button class="subscribe-btn" id="subscribeBtn" style="display:none;">Subscribe</button>
                </div>

                <div class="interaction-buttons">
                    <button class="interact-btn" id="likeBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
                        <span id="likeCount">0</span>
                    </button>
                    <div class="interact-divider"></div>
                    <button class="interact-btn" id="dislikeBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="transform: rotate(180deg)"><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></svg>
                    </button>
                </div>
            </div>

            <div style="background:var(--bg-secondary); padding:16px; border-radius:12px; margin-bottom:24px;">
                <p class="video-description" id="videoDescription"></p>
            </div>

            <!-- COMMENTS SECTION -->
            <div class="comments-section">
                <div class="comments-header" id="commentsHeader">0 Comments</div>
                
                <div class="comment-input-wrapper">
                    <div class="comment-avatar" id="myCommentAvatar">?</div>
                    <input type="text" id="commentInput" class="comment-input" placeholder="Add a comment...">
                    <button id="postCommentBtn" class="comment-submit">Post</button>
                </div>

                <div id="commentsList"></div>
            </div>

    <!-- RIGHT: RECOMMENDATIONS SIDEBAR -->
    <div class="recommendations-sidebar" id="recsContainer">
        <div style="font-weight:600; font-size:18px; margin-bottom:12px;">Up Next</div>
        <!-- Recommended videos will be injected here -->
    </div>

</div>

<script src="/public/js/player.js"></script>
</body>
</html>
