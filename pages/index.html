<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orix</title>
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.1/400.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.1/500.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-sans@5.0.1/600.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5.0.1/400.css" rel="stylesheet">
    <link rel="stylesheet" href="/public/css/main.css">
</head>
<body>

<!-- TOPBAR -->
<header class="topbar">
    <div class="logo-container" onclick="window.location.href='/'">
        <img src="/public/logo.svg" alt="Orix" class="logo-icon">
        orix
    </div>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="Search videos, creators, or topics...">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
    </div>

    <div class="topbar-right">
        <button class="upload-btn" id="uploadBtnTop" onclick="window.location.href='/upload'">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Upload
        </button>
        <div class="profile-btn" id="profileBtn">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
            </svg>
            <!-- Auth Dropdown -->
            <div class="auth-dropdown" id="authDropdown">
                <div id="guestMenu">
                    <div class="auth-dropdown-item" id="loginBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                        Sign In
                    </div>
                    <div class="auth-dropdown-item" id="registerBtn">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/><line x1="16" y1="11" x2="20" y2="11"/><line x1="18" y1="9" x2="18" y2="13"/></svg>
                        Create Account
                    </div>
                </div>
                <div id="userMenu" style="display:none;">
                    <div class="user-info-row">
                        <strong id="dropdownUsername">—</strong>
                        <span id="dropdownEmail">—</span>
                    </div>
                    <div class="auth-dropdown-item" onclick="window.location.href='/upload'">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="16 16 12 12 8 16"/><line x1="12" y1="12" x2="12" y2="21"/><path d="M20.39 18.39A5 5 0 0 0 18 9h-1.26A8 8 0 1 0 3 16.3"/></svg>
                        Upload Video
                    </div>
                    <div class="auth-dropdown-divider"></div>
                    <div class="auth-dropdown-item" id="logoutBtn" style="color:#ff6b6b;">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                        Sign Out
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- APP LAYOUT -->
<div class="app-layout">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <div class="nav-item active" id="navHome">
            <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            Home
        </div>
    </aside>

    <!-- MAIN FEED -->
    <main class="main-content">
        <div class="feed-header">
            <div class="feed-title" id="feedTitle">Latest Videos</div>
        </div>

        <div class="video-grid" id="videoGrid">
            <div class="loading-spinner">
                <div class="spinner"></div>
            </div>
        </div>

        <!-- Load More -->
        <div style="display:flex;justify-content:center;margin-top:40px;">
            <button id="loadMoreBtn" style="display:none;padding:12px 32px;background:var(--bg-secondary);border:1px solid var(--border-color);border-radius:var(--radius-pill);color:var(--text-primary);font-family:var(--font-sans);font-size:14px;font-weight:500;cursor:pointer;">
                Load More
            </button>
        </div>
    </main>
</div>

<!-- AUTH MODAL -->
<div class="modal-overlay" id="authModal">
    <div class="modal">
        <!-- LOGIN FORM -->
        <div id="loginForm">
            <div class="modal-title">Welcome back</div>
            <div class="modal-subtitle">Sign in to your Orix account</div>
            <div class="error-message" id="loginError"></div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-input" id="loginEmail" placeholder="you@email.com">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" id="loginPassword" placeholder="Your password">
            </div>
            <button class="btn-primary" id="loginSubmit">Sign In</button>
            <div class="modal-switch">
                No account? <span id="switchToRegister">Create one</span>
            </div>
        </div>

        <!-- REGISTER FORM -->
        <div id="registerForm" style="display:none;">
            <div class="modal-title">Create account</div>
            <div class="modal-subtitle">Join Orix and start sharing</div>
            <div class="error-message" id="registerError"></div>
            <div class="form-group">
                <label class="form-label">Username</label>
                <input type="text" class="form-input" id="regUsername" placeholder="yourname">
            </div>
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="email" class="form-input" id="regEmail" placeholder="you@email.com">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" class="form-input" id="regPassword" placeholder="Min. 6 characters">
            </div>
            <button class="btn-primary" id="registerSubmit">Create Account</button>
            <div class="modal-switch">
                Have an account? <span id="switchToLogin">Sign in</span>
            </div>
        </div>

        <!-- Close -->
        <div style="text-align:center;margin-top:16px;">
            <span style="font-size:13px;color:var(--text-secondary);cursor:pointer;" id="closeModal">Cancel</span>
        </div>
    </div>
</div>

<script src="/public/js/main.js"></script>
</body>
</html>
